name: MCP CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/mcp-ci.yml'
  workflow_dispatch:

jobs:
  test-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: trackyourbucks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Verify MCP app and tools
        run: |
          python - <<'PY'
          import asyncio
          from main import app
          from mcp_server import mcp

          assert any(getattr(route, 'path', None) == '/api/mcp' for route in app.routes)

          async def check_tools():
              tools = await mcp.list_tools()
              names = {tool.name for tool in tools}
              expected = {
                  'get_earnings_summary', 'list_jobs', 'get_hours',
                  'get_payments', 'add_hours', 'add_hours_range',
                  'add_monthly_hours', 'add_payment'
              }
              missing = expected - names
              assert not missing, f'Missing MCP tools: {missing}'

          asyncio.run(check_tools())
          print('MCP integration checks passed')
          PY
      - name: Run MCP hour-log unit tests
        run: pytest -q tests/test_mcp_hours_ranges.py

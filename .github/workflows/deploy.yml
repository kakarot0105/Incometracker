name: Deploy to IONOS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Build frontend on GitHub Actions (fast, reliable)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm install --legacy-peer-deps

    - name: Build frontend
      working-directory: frontend
      env:
        CI: false
      run: npm run build

    # STEP 1: Copy the pre-built frontend to IONOS VPS first
    - name: Copy frontend build to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "frontend/build/"
        target: "/root/Incometracker/"
        overwrite: true

    # STEP 2: Update backend and reload Nginx on IONOS VPS
    - name: Update backend and reload Nginx
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        command_timeout: 10m
        script: |
          cd /root/Incometracker
          git pull origin main
          
          # Update backend (don't fail if venv issues)
          cd backend
          source venv/bin/activate 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
          pm2 restart backend 2>/dev/null || true
          
          # Verify frontend build
          echo "=== Frontend files ==="
          ls /root/Incometracker/frontend/build/static/js/ 2>/dev/null || echo "No JS files!"
          
          # Reload Nginx
          systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || true
          
          echo "✅ Deployment complete!"

name: Deploy to IONOS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Build frontend on GitHub Actions (fast, reliable, no Node needed on VPS)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm install --legacy-peer-deps

    - name: Build frontend
      working-directory: frontend
      env:
        CI: false
      run: npm run build

    # Deploy everything to IONOS VPS via SSH
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        command_timeout: 10m
        script: |
          set -e
          cd /root/Incometracker
          git pull origin main
          
          # Update backend
          cd backend
          source venv/bin/activate
          pip install -r requirements.txt
          pm2 restart backend
          
          # Reload Nginx
          systemctl reload nginx || nginx -s reload || true
          
          echo "✅ Backend deployed!"

    # Copy the pre-built frontend to VPS
    - name: Copy frontend build to VPS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "frontend/build/"
        target: "/root/Incometracker/"
        overwrite: true

    # Final: reload Nginx to pick up new files
    - name: Reload Nginx
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          echo "=== Verifying build files ==="
          ls /root/Incometracker/frontend/build/static/js/ || echo "No JS found"
          systemctl reload nginx || true
          echo "✅ Deployment complete!"

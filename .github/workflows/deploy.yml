name: Deploy to IONOS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        command_timeout: 15m
        script: |
          set -e
          cd /root/Incometracker
          git fetch origin main
          git reset --hard origin/main
          
          # Update backend
          cd backend
          source venv/bin/activate 2>/dev/null || true
          pip install -r requirements.txt
          # Recreate the PM2 process so it uses the combined API + MCP entrypoint.
          pm2 delete backend 2>/dev/null || true
          pm2 start "venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000" --name backend
          pm2 save
          
          # Build frontend
          cd ../frontend
          
          # Force Node 18 without needing sudo or nvm
          echo "Downloading Node 18..."
          wget -qO- https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.gz | tar -xz
          export PATH=$PWD/node-v18.20.4-linux-x64/bin:$PATH
          echo "Using Node.js: $(node -v)"
          
          rm -rf node_modules
          npm install --legacy-peer-deps > build.log 2>&1 || {
            cp build.log /var/www/trackyourbucks/error.txt
            chmod 755 /var/www/trackyourbucks/error.txt
            echo "❌ npm install failed, error log served at /error.txt"
            exit 1
          }
          CI=false npm run build >> build.log 2>&1 || {
            cp build.log /var/www/trackyourbucks/error.txt
            chmod 755 /var/www/trackyourbucks/error.txt
            echo "❌ npm run build failed, error log served at /error.txt"
            exit 1
          }
          
          # Clean up local node
          rm -rf node-v18.20.4-linux-x64
          
          # Only sync if build produced files
          if [ -f "build/index.html" ]; then
            rsync -av --delete build/ /var/www/trackyourbucks/
            chmod -R 755 /var/www/trackyourbucks/
            chown -R www-data:www-data /var/www/trackyourbucks/
            systemctl reload nginx
            echo "✅ Deployment complete!"
          else
            echo "❌ Build failed - no index.html found, skipping deploy"
            exit 1
          fi

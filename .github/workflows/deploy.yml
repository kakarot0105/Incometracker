name: Deploy to IONOS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        command_timeout: 15m
        script: |
          cd /root/Incometracker
          git pull origin main
          
          # Update backend
          cd backend
          source venv/bin/activate 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
          pm2 restart backend 2>/dev/null || true
          
          # Build frontend
          cd ../frontend
          
          # Ensure Node 18 LTS is installed (react-scripts@5 breaks on Node 20+)
          node_version=$(node --version 2>/dev/null | cut -d'v' -f2 | cut -d'.' -f1)
          if [ -z "$node_version" ] || [ "$node_version" -gt 18 ]; then
            echo "Installing Node 18 LTS via NodeSource..."
            curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
            apt-get install -y nodejs
          fi
          echo "Node version: $(node --version)"
          
          npm install --legacy-peer-deps
          CI=false npm run build || { echo "❌ Frontend build FAILED!"; exit 1; }
          
          # Verify build output exists
          [ -d "build" ] && [ "$(ls -A build)" ] || { echo "❌ Build directory is empty!"; exit 1; }
          
          # Sync build to Nginx web root
          rsync -av --delete build/ /var/www/trackyourbucks/
          
          # Reload Nginx
          systemctl reload nginx
          
          echo "✅ Deployment complete!"

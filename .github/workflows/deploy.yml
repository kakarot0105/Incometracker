name: Deploy to IONOS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        command_timeout: 15m
        script: |
          cd /root/Incometracker
          git pull origin main
          
          # Update backend
          cd backend
          source venv/bin/activate 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
          pm2 restart backend 2>/dev/null || true
          
          # Build frontend
          cd ../frontend
          rm -rf node_modules
          npm install --legacy-peer-deps
          CI=false npm run build
          
          # Only sync if build produced files
          if [ -f "build/index.html" ]; then
            rsync -av --delete build/ /var/www/trackyourbucks/
            chmod -R 755 /var/www/trackyourbucks/
            chown -R www-data:www-data /var/www/trackyourbucks/
            systemctl reload nginx
            echo "✅ Deployment complete!"
          else
            echo "❌ Build failed - no index.html found, skipping deploy"
            exit 1
          fi

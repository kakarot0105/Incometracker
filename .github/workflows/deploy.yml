name: Deploy to IONOS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Build frontend on GitHub Actions
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm install --legacy-peer-deps

    - name: Build frontend
      working-directory: frontend
      env:
        CI: false
      run: npm run build

    # Install sshpass for password-based SSH/SCP
    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    # Transfer build files to VPS using rsync over SSH
    - name: Deploy frontend build to VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      run: |
        sshpass -p "$VPS_PASSWORD" rsync -avz --delete \
          -e "ssh -o StrictHostKeyChecking=no" \
          frontend/build/ \
          ${VPS_USER}@${VPS_HOST}:/root/Incometracker/frontend/build/

    # Update backend and reload Nginx
    - name: Update backend and reload Nginx
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      run: |
        sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} << 'EOF'
          cd /root/Incometracker
          git pull origin main
          
          # Update backend
          cd backend
          source venv/bin/activate 2>/dev/null || true
          pip install -r requirements.txt 2>/dev/null || true
          pm2 restart backend 2>/dev/null || true
          
          # Verify frontend
          echo "=== Frontend build files ==="
          ls -la /root/Incometracker/frontend/build/static/js/ || echo "No JS!"
          
          # Reload Nginx
          systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || true
          
          echo "✅ Deployment complete!"
        EOF
